# ==============================================================================
# Dependabot Configuration: Solana Anchor & Node.js DevSecOps Continuous Audit
# Modulo: .github/dependabot.yml
# Autoria Oficial: Marco Antonio Conceicao
# Politica de Governanca: Regra C44 (Nao-Destrutiva) - Zero Mocks & Zero Stubs
# ==============================================================================

version: 2
updates:
  # 1. Monitoramento continuo de dependencias Node.js e TypeScript no diretorio raiz
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps-npm)"
      include: "scope"

  # 2. Monitoramento de dependencias Rust na raiz do Virtual Workspace
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps-cargo)"
      include: "scope"

  # 3. Monitoramento estrito do programa Anchor Security Program na subpasta /programs
  - package-ecosystem: "cargo"
    directory: "/programs/anchor_security_program"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-anchor)"
      include: "scope"

  # 4. Monitoramento estrito do programa Solana Sandbox Counter na subpasta /programs
  - package-ecosystem: "cargo"
    directory: "/programs/solana_sandbox_counter"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-anchor)"
      include: "scope"
