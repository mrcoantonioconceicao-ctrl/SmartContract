# ==============================================================================
# Dependabot Configuration: Solana Anchor & Node.js DevSecOps Continuous Audit
# Modulo: .github/dependabot.yml
# Autoria Oficial: Marco Antonio Conceicao
# Politica de Governanca: Regra C44 (Nao-Destrutiva) - Zero Mocks & Zero Stubs
# ==============================================================================

version: 2
updates:
  # 1. Monitoramento continuo de dependencias Node.js e TypeScript (package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
      - "typescript"
      - "devsecops"
    commit-message:
      prefix: "chore(deps-npm)"
      include: "scope"

  # 2. Monitoramento de dependencias Rust na raiz do Virtual Workspace (Cargo.toml)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
      - "cargo"
      - "devsecops"
    commit-message:
      prefix: "chore(deps-cargo)"
      include: "scope"

  # 3. Monitoramento do programa Anchor Security Program (programs/anchor_security_program)
  - package-ecosystem: "cargo"
    directory: "/programs/anchor_security_program"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
      - "anchor"
      - "svm"
    commit-message:
      prefix: "chore(deps-anchor)"
      include: "scope"

  # 4. Monitoramento do programa Solana Sandbox Counter (programs/solana_sandbox_counter)
  - package-ecosystem: "cargo"
    directory: "/programs/solana_sandbox_counter"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
      - "anchor"
      - "svm"
    commit-message:
      prefix: "chore(deps-anchor)"
      include: "scope"
