[advisories]
ignore = [
  "RUSTSEC-2023-0071", # rustls-pemfile: 1.x is unmaintained in favor of 2.x (transitive from solana CLI/RPC)
  "RUSTSEC-2023-0031", # spin: 0.5.2 mutex lock sound advisory (mitigated in spin 0.9.8+)
  "RUSTSEC-2020-0071", # chacha20: legacy version advisory in transitive crypto
  "RUSTSEC-2024-0370", # transitive advisory in solana-program 1.18 toolchain
  "RUSTSEC-2024-0019", # anyhow informational advisory
  "RUSTSEC-2020-0159", # time crate legacy
  "RUSTSEC-2021-0145", # atty legacy
  "RUSTSEC-2022-0090", # rcgen legacy
  "RUSTSEC-2024-0437", # curve25519-dalek legacy transitive
  "RUSTSEC-2026-0251", # sized-chunks 0.6.5 is transitively required by im 15.1.0 -> solana-frozen-abi 1.18.26 -> solana-program 1.18.26 for Solana 1.18.26 compatibility; not used at runtime on-chain in SBF/BPF.
  "RUSTSEC-2024-0344", # curve25519-dalek 3.2.1 -> solana-program 1.18.26 -> solana-sandbox-counter; >=4.1.3 requires changing the pinned Solana 1.18 dependency graph.
  "RUSTSEC-2026-0247", # bitmaps 2.1.0 -> sized-chunks 0.6.5 -> im 15.1.0 -> solana-frozen-abi 1.18.26 -> solana-program.
  "RUSTSEC-2024-0388", # derivative 2.2.0 -> ark-poly/ark-ec/ark-bn254 -> solana-program 1.18.26 and light-poseidon 0.2.0 -> solana-program.
  "RUSTSEC-2026-0248", # im 15.1.0 -> solana-frozen-abi 1.18.26 -> solana-program.
  "RUSTSEC-2025-0161", # libsecp256k1 0.6.0 -> solana-program 1.18.26 -> solana-sandbox-counter.
  "RUSTSEC-2024-0436", # paste 1.0.15 -> ark-ff 0.4.2 -> solana-program 1.18.26 and light-poseidon 0.2.0.
]
informational_warnings = ["unmaintained", "notice"]
severity_threshold = "critical"

[output]
deny = []
quiet = false
